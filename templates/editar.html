<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Movimentação</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>

    <div class="form-card">

        <h2>Editar movimentação</h2>

        <form action="/atualizar/{{ gasto[0] }}" method="POST">

            <input
                type="text"
                name="descricao"
                value="{{ gasto[1] }}"
                required
            >

            <input
                type="number"
                step="0.01"
                name="valor"
                value="{{ gasto[2] }}"
                required
            >

            <select name="tipo">

                <option value="receita"
                    {% if gasto[3] == 'receita' %}selected{% endif %}>
                    Receita
                </option>

                <option value="despesa"
                    {% if gasto[3] == 'despesa' %}selected{% endif %}>
                    Despesa
                </option>

            </select>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

        <br>

        <a href="/dashboard">
            ← Voltar ao Dashboard
        </a>

    </div>

</body>
</html>
