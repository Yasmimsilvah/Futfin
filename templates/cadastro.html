<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/cadastro.css') }}">
</head>
<body>
<div class="container">

    <h1>FUTE<span>FIN</span></h1>

    <form action="/cadastro" method="POST">

        <input
            type="text"
            name="nome"
            placeholder="Nome completo"
            required>

        <input
            type="email"
            name="email"
            placeholder="E-mail"
            required>

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required>

        <button type="submit">
            Cadastrar
        </button>

    </form>

    <div class="login-link">
        Já possui uma conta?
        <a href="/login">Entrar</a>
    </div>

</div>
</body>
</html>
